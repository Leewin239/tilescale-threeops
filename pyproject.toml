[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilescale-threeops"
version = "0.1.0"
description = "Fixed-resource AG, RS and AR kernels and Qwen3 Megatron training paths"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tilescale_threeops = ["native/*.cc", "native/*.so"]

[tool.setuptools.data-files]
"share/tilescale-threeops/third_party" = ["third_party/LICENSE.TileScale", "third_party/NOTICE.md"]
